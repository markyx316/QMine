[project]
name = "qmine"
version = "1.0.0"
description = "A twelve-phase query-intent mining and clustering agent team, built on LangGraph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "pyarrow>=15.0",
  "joblib>=1.4",
  "langgraph>=1.2.11,<2",
  "langchain-core>=1.5,<2",
  "langchain>=1.3,<2",
  "langchain-anthropic>=1.5,<2",
  "langgraph-checkpoint-sqlite>=3.1.1,<4",
]

[project.optional-dependencies]
# Real sentence encoders. Without these the pipeline still runs, on a
# deterministic hashing projection that captures surface form only.
embeddings = ["sentence-transformers>=5.0", "torch>=2.2"]
# Chinese word segmentation for the word-level TF-IDF block.
zh = ["jieba>=0.42"]
# Notebook delivery and 2-D projections.
report = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "umap-learn>=0.5", "openpyxl>=3.1"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
all = [
  "sentence-transformers>=5.0", "torch>=2.2", "jieba>=0.42",
  "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29", "umap-learn>=0.5",
  "openpyxl>=3.1", "pytest>=8.0",
]

[project.scripts]
qmine = "qmine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qmine = ["agents/prompts/*.md", "report/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=900"
