# POOLED-8 corpus for the 影视 vertical: the four sources of `pool5_film.yaml` PLUS the four exports
# that arrived 2026-09-16 — search random-10k for both years, a PV-ranked voice head and a random
# voice 1k.
#
# Built by `analysis/pooled5/build_pool8_corpus.py`, which asserts cell-for-cell that the four shared
# snapshots come out identical to the delivered `影视_pooled5.parquet`. So this corpus is a strict
# superset of the one film-pool5 mined, and any difference in results is attributable to the four new
# exports rather than to a rebuild.
#
# WHAT THE NEW EXPORTS BUY. Until now search was head-only and there was no voice at all, so
# "search vs assistant" and "head vs tail" were confounded and input mode could not be looked at.
# Measured on the raw files: head ∩ random = 19 strings of 10,000 (2025) and 2 (2026); the random
# strata churn completely year over year (rand25 ∩ rand26 = 0) while the voice head overlaps the
# search heads heavily (346 / 700).
#
# ROUTING is the default policy from `live.yaml` — unlike 人物, this material has never drawn a
# provider content filter.
#
# `extends: live.yaml` because `--config` REPLACES the default rather than merging it; without this
# line the whole provider policy is silently dropped.
extends: live.yaml

data:
  input_path: data/raw/pooled5/影视8_pooled5.parquet
  text_column: query

  # Normalised WITHIN source to 10,000 (see the builder). NOTE for the report: the assistant head
  # export loses 78.3% of its raw PV to cleaning (45 rows), so this domain reports row shares first
  # and traffic only as a supplement, with that figure attached.
  weight_column: pv_norm

  # `ops/drift.label_drift` compares EXACTLY two groups, so p10b is pointed at the two-level surface
  # column; the eight-level `source` column rides along for the post-run analysis and is re-joined
  # positionally (`labels_full.csv` preserves input order).
  snapshot_column: surface

  # The two groups differ by SURFACE, not by date (.claude/rules/multi-snapshot.md). The 2025 vs 2026
  # comparison inside the search side is made in the post-run analysis, not by p10b.
  comparison_axis: stratum

  # Deliberately empty. `l2` exists for assistant rows only (~4% coverage) — declared as a reference
  # it would ask the K locator to find a partition that separates the assistant from search, which is
  # the comparison, not the frame.
  reference_label_columns: []
