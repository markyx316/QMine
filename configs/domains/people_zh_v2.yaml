pragmatic_intents_hint:
- 突发人事/新闻状态查询：同一个裸名字，在事件当天是「最新动态」，平日是「生平档案」。头部三条 陈小江/马兴瑞/韦韬 合计占全库 16.4% PV，全部来自 2025-07-01 当天的新疆、广西人事发布，词面上完全没有痕迹，只有 (人名 × 日期 × 新闻索引) 才能分开
- 讣闻核实 vs 谣言核实：「蔡澜」（快照前 6 天去世，30k PV）以裸名字进入，与「赵本山去世了吗」「马云死了吗」词面同族但处置相反——一个要权威新闻，一个要辟谣标签
- 反向人物解析：实测 是谁$ 74 条中绝大多数是「作品/关系/职务 → 人物」（水浒传的作者是谁、宋佳老公是谁、新疆党委书记是谁），检索方向与「这个人是谁」相反，聚类只看得到共同的「是谁」
- 裸名字的身份消歧：同一字符串可能指向多个真实人物、也可能指向文艺形象（白鹿、哪吒、财神爷、李白），是人物垂类的核心失败模式，纯文本聚类结构上不可见
- 导航型意图：求某人的微博/主页/账号（微博$ 37 条，0.37%），与信息型查询词面无差别，但满足条件是跳转而不是答案
- 人事异动的委婉语：「另有任用」无法律定义，实际意图是「这个人的职位发生了什么」，且正确答案可能是「尚无权威公告」；仅 16 行却占 0.46% PV
- 主体人群决定答案来源：官员 / 艺人 / 文史虚构人物（约 1.0% 行：孙悟空、李白、诸葛亮、杨贵妃、水浒传的作者）三类，同一意图的权威来源与合规基线完全不同，而人群在 query 串里不可见——应作为每个叶子的必备属性，而不是并列分支
- 类目级浏览伪装成人物 query：美女/帅哥/明星等（0.60% 行、0.99% PV）根本不是人物查询，应进拒识类而非意图类
- 行数与流量背离：色情向 0.60% 行 / 0.99% PV，人事异动 0.16% 行 / 0.46% PV——按行频排序会把这两类判成尾部噪声
- 机构范围内找人（大学/中学/医院/集团 + 人名或职务）：搜索随机层 1,333 行对头部 34 行（39.2 倍），v1 九个种子一条都碰不到。**没有做成种子**——这 1,455 行里 66.7% 不含任何意图标记，与全库平均（69.5%）几乎一样裸，它抓的是实体不是措辞；当成 template group 会直接主导 fragmentation 指标。
- 平台账号与主页导航（微博/抖音/快手/小红书/公众号/主页/账号）单独只有 170 行，低于 176 行的地板，机械上做不成种子；微博$ 本身只有 90 行。「联系方式」那一支由 private_individual_locator 风险类承载，不要再做种子重复。
- 花名册意图同源三用：种子只留 名单$（509 行、与 v1 九种子零重叠、精度 19/20），风险侧留 institutional_roster_disclosure（131 行）；宽式（领导班子|班子成员|名单|一览表，1,035 行）若同时提交，窄式会被 build_groups 的 85% 规则**静默**丢弃。
- 是非核实（吗|嘛 收尾）658 行，几乎只在随机层与助手侧；v1 没有任何种子覆盖它。
- 人→职方向：v1 的 party_post_holder / state_post_holder 只覆盖职→人，与 person_to_post_lookup 重叠 0 行。时效线（现任|历任|新任）与方向线在「现任什么职务」上必然交叉（117 行），下游不要把同一族当两个意图的证据。
domain_notes: "All figures measured on data/raw/人物query-250701.xlsx: 10,000 rows, 9,966,159 PV,\nno duplicate queries.\n\n1. THIS IS A BARE-NAME LOG. Median query length is 3 characters; 61.8% of rows and\n\
  \   74.7% of PV are <=3 chars, 70.6% / 80.5% at <=4 chars. Against a generous marker\n   lexicon (简介|资料|简历|书记|主席|是谁|图片|年龄|老婆|去世|另有任用|个人|...), 81.2% of\n   rows and 87.0% of PV match NOTHING. Intent is\
  \ a prior over the PERSON, not a\n   property of the string, so any taxonomy read off query text describes under 20% of\n   rows and near-zero of the head traffic. Say so explicitly rather than reporting\
  \ the\n   marked minority as if it were the corpus.\n\n2. THE HEAD IS NEWS, NOT EVERGREEN. 陈小江 (961,536 PV), 马兴瑞 (502,916), 韦韬 (170,243)\n   are 16.4% of all PV and are one single-day political-personnel\
  \ event (the 2025-07-01\n   Xinjiang party-secretary change and the Guangxi appointment); 蔡澜 (30k) had died six\n   days earlier. The largest intent in the corpus is \"what just happened to this person\"\
  \n   and it is lexically invisible. Do not model this vertical as a stable evergreen\n   biography log.\n\n3. THREE SUBJECT POPULATIONS, NOT TWO. Serving officials (习近平, 省委书记, 另有任用),\n   entertainers\
  \ (鹿晗, 肖战, 白鹿, 刘宇宁, 王安宇), and fictional/historical/literary\n   figures (~1.0% of rows: 孙悟空, 哪吒, 李白, 诸葛亮, 杨贵妃, 财神爷, 水浒传的作者). The same\n   intent resolves to a different authoritative source and a different\
  \ lawful basis per\n   population — 人民网地方领导资料库 / 新华社 for officials, self-disclosed profiles for\n   entertainers, reference works for the third. The population is invisible in the query\n   string: carry\
  \ it as a required attribute on every leaf, never as a sibling branch.\n\n4. 是谁 DOES NOT MEAN \"who is this person\" HERE. Of 74 是谁$ rows, the dominant shape is\n   「X的作者/老公/书记/主人公是谁」 — reverse resolution\
  \ from a work, relation or post to a\n   person. The bare-name identity intent, which is the corpus's implicit majority, takes\n   no marker at all. A naming agent that reads 是谁 as identity lookup will\
  \ mislabel the\n   class.\n\n5. THE BIOGRAPHY SUFFIX BLOCK IS THE CORE LAWFUL INTENT, NOT A HAZARD. 简介/介绍 5.64%,\n   资料 2.75%, 简历/履历 2.14%. This is lawfully published record (PIPL Art. 27; SPC\n   网络侵权解释\
  \ Art. 12(四) exempts 自行或已合法公开的信息). Labelling the whole ~11% bio-PII\n   regex as risk is a false-positive class, not a safety win. The genuinely risky tail is\n   the relational slice (老婆/妻子/家世/前妻, 0.71%)\
  \ and only when the subject is an official.\n\n6. SERVING IS NOT AMPLIFYING. 违法信息 may not be transmitted at all; 不良信息 (炒作绯闻丑闻;\n   性暗示) is merely barred from 首页首屏/热搜/榜单/推荐 (生态治理规定 Art. 11), and the 2021\n\
  \   娱乐明星网上信息规范通知 lands on the same ranking surfaces. Risk labels in this vertical\n   should drive source routing and ranking-surface eligibility, not blanket suppression.\n\n7. PV AND ROW FREQUENCY DISAGREE,\
  \ IN BOTH DIRECTIONS. Adult-adjacent: 0.60% of rows,\n   0.99% of PV. Personnel change: 0.16% of rows, 0.46% of PV. Bio suffixes go the other\n   way (5.64% of rows, 3.39% of PV). Report both; a row-weighted\
  \ taxonomy will call the\n   high-traffic classes tail noise.\n\n8. SCRIPT MINORITY. 1.91% of rows contain Latin characters, 1.37% are pure Latin (aespa,\n   treasure, beyond, rose, liam gallagher) —\
  \ K-pop and band names. A ~2% script minority\n   is exactly the size that collapses into a single junk cluster on a Chinese-only\n   encoder; check explicitly whether this slice became its own leaf,\
  \ and do not accept\n   such a leaf as an intent.\n\n9. ENTITY DOMINANCE IS THE FAILURE MODE. With 81% of rows carrying no intent marker,\n   clustering will organise by person and by topic (all 陈小江 rows\
  \ together) rather than\n   by intent. A high L1 count is a symptom of that, not a richer taxonomy.\n\n10. TEMPLATE COVERAGE WILL READ \"too_low\" AND THAT IS CORRECT. The nine seeds above plus\n   the\
  \ mined affixes cover 17.1% of rows on this file, because 81% of it is bare names.\n   Do not loosen the seeds to chase the coverage window — a loose seed sweeps two intents\n   into one group and corrupts\
  \ the alpha sweep it is supposed to judge. Note also what the\n   affix miner discovers here: the surviving discovered groups are 前缀「陈小」and 前缀「新疆」\n   — person and place prefixes, i.e. ENTITIES, not phrasings.\
  \ They must not be read as\n   phrasing families.\n\n## v2（8 快照，43,802 行）新增了什么，以及每条的实测\n\n- 种子地板：`build_groups` 要求命中/行数 >= 0.004，本域即 **>= 176 行**；低于地板的候选会被**静默**丢弃，不报错。\n- 本档案的 19 个种子在真 `build_groups`\
  \ 下全部存活，合计覆盖 **27.95%** 的行；逐快照：2025search 18.44%、2025search_rand 32.12%、2026search 33.3%、2026search_rand 30.36%、assistant_random 32.11%、assistant_top 17.55%、assistant_voice_random 28.2%、assistant_voice_top\
  \ 8.51%。\n- evaluation_comparison 的原提议含 `怎么样`，把「后来怎么样了」这一族近况问法一起吞进来（实测精度 0.60）；去掉 `怎么样` 后 203 行、仍在地板之上，残留的是「张雪峰评价<学校>」式机构评价（31 行 ≈ 15%）。\n- incumbency_tenure 删掉了 `原任`（全库 0 行）；`新任` 的 92 行里 59 行来自「最新任命/最新任免」的子串碰撞。\n\
