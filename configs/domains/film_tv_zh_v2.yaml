pragmatic_intents_hint:
- 裸片名导航（以法之名 365k PV、逆爱 303k PV）：no modifier at all, matched by no regex, the largest class by PV. Lexically it is just a proper noun, so clustering groups it by title similarity and genre — the intent
  (watch / look up / disambiguate) is simply not in the string.
- 授权状态：「逆爱2025全集免费观看」与「以法之名免费观看」逐字同构，合规结论相反。Licence status is a property of the TITLE, resolvable only by a title × availability join. No representation of the query text can recover it.
- 同一串字符既是作品名也是导航目标：抖音、樱花动漫、cctv5、囧次元 look exactly like titles and are destinations. Serving them as titles is the misclassification, and for the unlicensed ones it is also the compliance event.
- 规避拼写：三年级=三级片、做aj、隐藏入口。Designed to look like an ordinary film query and to embed harmlessly among them; the standard words (三级/禁片/色情) match zero rows in this corpus.
- 追更 vs 首次观看：「逆爱第8集什么时候更新」求档期，「逆爱免费观看」求播放器 — near-identical phrasing, different answer surface.
- 演员反查 vs 作品演员表：「张凌赫主演的电视剧」是 person→works，「以法之名演员表」是 work→people。Both carry 主演/演员; the lookup runs in opposite directions and clustering will merge them.
- 平台账号与客服（爱奇艺怎么取消自动续费、抖音充值入口）：a service/account question wearing a platform name, not a content query.
- '二创/解说消费 vs 正片消费: consuming a derivative is a different intent AND a different rights position. Measured at 2 rows here — do not seed it on this corpus, but expect it wherever short-video traffic is included.'
- 形状不是意图：《》包裹 2,300 行、全串 ≤3 字 2,349 行（语音头部 24.0% 的串 ≤3 字）。两者都**没有**做成种子——它们把裸片名导航按书写习惯切开，而不是按意图切开；v1 hint 里「裸片名导航是最大的类、正则抓不到」在新四层同样成立。
- channel_number_nav 包含 v1 channel_live_tv 的 86.0%，已**取代**它。两条同时写进档案时，排在后面的会被 85% 规则静默丢弃；要保留两条就必须写死顺序（窄的在前）。
- 短剧（841 行）与季/番更新进度（2,076 行）是旧四层几乎不存在的新品类，后者是本域最大的新种子。
- 外语剧集的资源获取（韩剧/泰剧/日剧 + 观看/网盘词，845 行）与盗版聚合站名单互补：名单抓站名，构词式抓形状，两者并集 829 行，单靠任一方都会漏掉一半。
- 「未成年人 × 性」用宽词表（含 童|少女）做共现会被噪声灌满（命中里绝大多数是人名与正常片名）；收紧词表后共现只剩 1 行，而那 1 行是真阳性。所以档案里不写「这类筛查建不起来」——它建得起来，只是必须用收紧的词表，并主要靠片名黑名单与癖好类承载。
domain_notes: '影视动漫 query log. Median length 9 characters against 3-6-character drama titles, so the typical query is [片名] + [一个修饰词] and the corpus is template-structured. That makes the modifier the intent
  signal and the title the noise — the opposite of most verticals — and it is why jieba will return unsegmentable garbage for the title half (these are drama names coined in the last year) while the char
  n-gram block carries the modifier.

  THE DOMINANT INTENT IS THE COMPLIANCE-SENSITIVE ONE, and that is the single fact a taxonomy for this vertical must be built around. Measured on 250701 (10,000 rows / 16,451,909 PV): the access vocabulary
  (免费观看|在线观看|完整版|全集|高清|免费播放|资源|网盘|百度云|夸克) matches 39.3% of rows and 46.1% of PV. Its parts: 免费观看 20.8% of rows / 25.5% PV, 在线观看 13.8% / 17.2%, 完整版 12.3% / 14.6%, 全集 12.1% / 14.9%, 高清 8.2% / 10.7%. Every
  other measured intent is two orders of magnitude smaller — 演员表 1.5%, 剧情/结局 1.3%, 第N集/多少集 1.8%, 哪里看/什么时候播 0.5%.

  免费观看 IS NOT A PIRACY SIGNAL. It names a viewing condition that licensed supply also satisfies, and it does so on this corpus''s own top titles: 以法之名 (365k + 358k + 87k PV) premiered on CCTV-8 黄金档 and
  优酷 the same night; 锦绣芳华 (140k PV) on 芒果TV + 湖南卫视 金鹰独播剧场; 红果免费短剧 is free-with-ads by design. Lawfulness is a property of the TITLE''s availability, not of the phrase, so any risk assignment on this axis
  must be a title × availability join and never a regex. The query is not the risk object — the answer is, and a risk label on a query pattern is a proxy that has to be validated against what that pattern''s
  result set actually contains.

  Two axes, not one, and flattening them is the main structural failure mode here. 电视剧 (19.0% of rows) / 电影 (7.8%) / 动漫 (4.5%) / 短剧 (1.6%) / 综艺 (0.3%) are ENTITY-TYPE disambiguators; 演员表 / 剧情 are ATTRIBUTE
  requests; 免费观看 / 在线观看 are ACCESS requests. One level cannot hold all three.

  The legitimate counterpart intent exists and is tiny: 哪里看/哪个平台/什么时候播 is 0.5% of rows against the access class''s 39.3%. That ratio is itself a headline result — the demand is for a player, not for a licensing
  answer — and the where-to-watch surface is the natural safe destination for redirected free-streaming demand (cf. Google''s Watch tab, and the search-engine practice documented by EUIPO 2024 and the UK
  IPO 2017 code, all of which key on the DESTINATION, never on per-query intent).

  Live linear TV is present and is a separate answer surface: cctv5在线直播 36,814 PV, cctv5节目表 26,960 PV. Relaying or linking an unlicensed 广播电视 频道 is prohibited by the same 56号令 Art. 17 as pirate on-demand,
  so a live branch inherits the risk axis rather than escaping it.

  Two measurement traps that cost real time here: (1) 下载 is NOT an acquisition -channel signal — 132 rows on 250701, dominated by app installs (抖音下载, 泰剧兔app官方下载); the channel signal is 网盘/百度云/夸克/迅雷/磁力/资源.
  (2) The channel class is wildly unstable between logs — 0.19% of rows on 250701 and 2.10% on 260701 — so never size it, or the piracy axis generally, from a single day''s log.

  Finally, the 动漫 half of the vertical is real (动漫/动画/番剧 4.5% of rows) and it is where the unlicensed-destination traffic concentrates: 囧次元 (44k PV) and 樱花动漫 (19k PV) are among the largest single queries
  in the corpus and are both unlicensed aggregators, not titles.


  ## v2（8 快照，43,933 行）新增了什么，以及每条的实测


  - 种子地板：`build_groups` 要求命中/行数 >= 0.004，本域即 **>= 176 行**；低于地板的候选会被**静默**丢弃。

  - 本档案的 21 个种子在真 `build_groups` 下全部存活，合计覆盖 **32.68%** 的行；逐快照：2025search 36.19%、2025search_rand 32.59%、2026search 34.65%、2026search_rand 29.8%、assistant_random 24.34%、assistant_top 29.95%、assistant_voice_random
  22.4%、assistant_voice_top 28.83%。

  - plot_outcome_qa 的三个「为什么X」臂是承重的：删掉它们只剩 158 行、低于地板，整条种子会消失；代价是组内混入平台/审查类问句（实测 18/20）。

  - open_why_how 是**句式族不是意图族**（平台求助与剧内追问各半），在 fragmentation 的解读里应当预期它碎。

  - v1 点名的 `三级片` / `禁片` 在本语料仍然是 **0 行**：漏掉的不是采样，而是词表少了 成人版/无修/无码/里番 这一族（37 行里 27 行落在两个搜索随机层）。`禁播` 的 5 行全部不是内容请求，已从词表删除。

  - numbered_euphemistic_serial 只保留「泛称+序号」一臂；`[0-9]{2,3}分钟` 那一臂 37 行里有 8 行是健身操、课间、歌舞视频，已删。

  - kr_hk_adult_title_family 删掉了 `甜性涩爱`（0 行）；`下女`、`秘密爱` 两个词仍会碰到无关内容，policy 采用前需按片名核对。

  - ncii_leak_aggregator 的风险对象是**答案页**不是 query 文本，与 v1 的 no_domestic_licence_supply 同属代理判断，落 drop 之前必须对命中集的实际结果页验证。

  '
