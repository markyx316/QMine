# 影视垂类领域档案 v2 — 为 8 快照语料（`影视8`，43,933 行）重写。v1（film_tv_zh）是 4 快照时写的，保持不变。
#
# 生成方式：`analysis/pooled5/build_pool8_profiles.py`。每一条新增都由两名研究员在本语料上量出来、再由一名怀疑者
# 逐条重算（复算发现的问题已全部应用：删死词、合并重复的聚合站类、删掉精度不足的臂、把形状族降级成 hints）。
# 种子 21 条、风险类 15 条，种子合计覆盖 32.68%；地板 = 176 行。
# 注意：`expected_min_share` / `expected_l1_range` 没有任何代码读取；风险类的样例会原文进入研究员提示词与 fast 工作簿。
key: film_tv_zh_v2
display_name: 影视动漫搜索 Query
language: zh
tokenizer: jieba
char_ngram_range:
- 1
- 3
word_ngram_range:
- 1
- 2
embedding_candidates:
- BAAI/bge-small-zh-v1.5
- BAAI/bge-base-zh-v1.5
- shibing624/text2vec-base-chinese
instruction_prefix: null
template_seeds:
- name: availability_lookup
  pattern: (哪里看|哪里能看|在哪看|在哪儿看|在哪能看|哪个平台|哪个台|哪个软件|什么时候播|什么时候上映|什么时候更新|几点更新|更新时间|播出时间|上映时间|定档)
  intent_hint: 求作品的合法可看渠道或播出时间 — the licensed counterpart of the free-streaming intent
- name: cast_crew
  pattern: (演员表|主演|导演是谁|阵容|扮演者|饰演者|谁演的)
  intent_hint: 求某作品的演职人员事实
  expected_min_share: 0.012
- name: episode_locator
  pattern: (第.{1,4}集|多少集|更新到第几集|共几集)
  intent_hint: 定位到某一集或问总集数/更新进度
  expected_min_share: 0.01
- name: plot_synopsis
  pattern: (剧情介绍|剧情简介|分集剧情|大结局|结局是什么|讲的什么)
  intent_hint: 求剧情梗概或结局，不求观看
  expected_min_share: 0.008
- name: recommendation
  pattern: (推荐|排行榜|片单|好看的.{0,4}(剧|电影|电视剧))
  intent_hint: 无具体片名，求片单/榜单
- name: free_access
  pattern: (免费观看|免费播放|免费看)
  intent_hint: 求以免费条件观看某部作品 — 语料的支配意图，合法与否取决于该片的授权状态，不取决于这个词
  expected_min_share: 0.15
- name: platform_account_service
  pattern: (抖音|快手|哔哩哔哩|b站|B站|爱奇艺|优酷|腾讯视频|芒果tv|芒果TV|西瓜视频|咪咕|红果|喜马拉雅|番茄|酷狗|视频号).{0,12}(怎么|如何|为什么|设置|账号|登录|注销|解绑|充值|会员|退款|续费|等级|音浪|播放量|限流|提现|实名|绑定|开通|客服|恢复|投诉|举报|收费|多少钱|入口|官网)
  intent_hint: 平台账号与服务问题：把平台当对象，而不是把作品当对象
- name: title_unknown_lookup
  pattern: (是什么电影|是什么电视剧|是什么剧|是什么动漫|是哪部电影|是哪部剧|是哪部电视剧|哪个电视剧|哪部电视剧|哪部电影|叫什么名字|叫什么电影|叫什么电视剧|片名叫什么|叫啥名字)
  intent_hint: 反向找片：给情节/画面求片名，与「已知片名求资源」方向相反
- name: scene_episode_locator
  pattern: (第几集|哪一集|哪一期|第几期|是第.{1,3}期|第几分钟|哪几集)
  intent_hint: 定位到集/期/分钟；v1 的 episode_locator 只覆盖集
- name: person_to_works
  pattern: ((演过|演的|主演的|拍过|出演|参演|参加|导演的).{0,6}(电影|电视剧|剧|综艺|节目|作品)|(的电影|的电视剧|的综艺|的作品)有哪些|作品有哪些|演过哪些|参加过哪些)
  intent_hint: 人→作品反查；v1 的 cast_crew 是作品→人
- name: plot_outcome_qa
  pattern: (和谁在一起|跟谁在一起|最后怎么|后来怎么|最终结局|结局是什么|结局如何|怎么死的|为什么会|为什么要|为什么不|是好是坏|有没有在一起)
  intent_hint: 剧情结局追问；三个「为什么X」臂是承重的——删掉就只剩 158 行、低于地板
- name: open_why_how
  pattern: (怎么办|怎么弄|怎么设置|怎么回事|为什么|是什么意思|什么意思|如何解决)
  intent_hint: 开放式怎么办/为什么：**句式族而非意图族**，组内混平台求助与剧内追问，fragmentation 预期会碎
- name: short_drama
  pattern: 短剧
  intent_hint: 短剧：一个在旧四层几乎不存在的新品类
- name: channel_number_nav
  pattern: (cctv|CCTV|央视|中央.{0,3}(台|套|频道)|卫视)
  intent_hint: 频道与台号导航；**取代 v1 的 channel_live_tv**（含它 86.0%，同时提交会被 85% 规则静默丢弃）
- name: language_version
  pattern: (国语版|粤语版|中文版|普通话版|中字|中文字幕|字幕版|国语配音|配音版|韩语版|泰语|原声版|国语高清|国语在线)
  intent_hint: 语种与版本轴；裸词 字幕|配音 会碰到音乐视频与生成指令，已锚定
- name: variety_show
  pattern: (综艺|真人秀|跑男|奔跑吧|极限挑战|歌手|好声音|春晚|晚会|颁奖典礼|脱口秀|相声|小品)
  intent_hint: 综艺与晚会：与剧集的检索行为不同
- name: nonfilm_ugc_video
  pattern: ((搞笑|舞蹈|广场舞|吃播|助眠|整蛊|开箱|教学|解说|游戏|化妆|美食|萌宠|减肥|健身|手工|钓鱼|修车|拆解|施工|旅游)视频|广场舞|小视频|短视频|直播回放)
  intent_hint: 非影视的 UGC 视频（广场舞、吃播、解说）——类目边界外溢
- name: season_progress
  pattern: (第[一二三四五六七八九十0-9]{1,3}季|年番|剧场版|新番|番剧|OVA|更新至|完结没|有没有第)
  intent_hint: 季/番/更新进度：追更行为，全域最大的新种子
- name: foreign_title_access
  pattern: (韩剧|泰剧|日剧|美剧|台剧|港剧).{0,12}(在线观看|免费观看|免费播放|免费看|全集|完整版|高清|资源|网盘|百度云|夸克|下载|在哪看|哪里看|在线播放|无删减|未删减|中字|字幕)|(在线观看|免费观看|免费播放|免费看|全集|完整版|高清|资源|网盘|百度云|夸克|下载|在哪看|哪里看|在线播放|无删减|未删减|中字|字幕).{0,12}(韩剧|泰剧|日剧|美剧|台剧|港剧)
  intent_hint: 外语剧集的资源获取（韩剧/泰剧/日剧 + 观看/网盘词）
- name: uncut_version_request
  pattern: (未删减|无删减|未删节|无删节)
  intent_hint: 未删减版本请求
- name: offline_channel_delivery
  pattern: (网盘|百度云|百度网盘|阿里云盘|夸克|迅雷|磁力|提取码|种子下载)
  intent_hint: 网盘/磁力等离线渠道
risk_categories:
- name: obscene_and_criminal_content
  patterns:
  - (人兽|人与动物|人狗大战|人犬|狗配|马配|猪马狗)
  - (做aj|小头头|幸福宝|芭乐视|大象传媒|麻花传剧|隐藏入口|无需付费|7{3,5}影院)
  - (丝瓜视频|樱桃视频|向日葵视频|香蕉视频|草莓视频|榴莲视频)
  - (李宗瑞|偷拍|迷奸|强奸)
  keywords:
  - 缘之空
  - 无颜之月
  - 姐孕
  - 亲吻姐姐
  - 黑兽
  - 灯草和尚
  - 金瓶梅
  - 妻子的姐姐
  - 鸭王
  - 农民伯伯乡下妹
  rationale: 'Obscene material under 刑法 363/364, whose 两高 interpretation sets conviction thresholds by click count. Serving a normal result — a working player link — is the distribution act itself, and
    快播 (2016) forecloses the "we only provide the technology" defence. This is the one category here where the exposure is criminal rather than civil, and the one where a false negative is unrecoverable.
    Measured 0.94% of rows / 1.07% of PV (250701) and 0.75% / 0.95% (260701).

    '
  policy: drop
- name: uncensored_cut_and_filter_evasion
  patterns:
  - (未删减|无删减)
  - (三年级|三年.{0,3}(大片|在线|免费|高清|经典|中文|观看|全集|片段))
  - (伦理片|伦理电影|^伦理$)
  - (床戏|吻戏|激情戏)
  keywords: []
  rationale: 'Requests for the pre-censorship cut of a work, or for the 擦边 fragment. 《网络视听节目内容审核通则》 requires the reviewed version, and a 未删减 cut has by definition no 公映许可证 / 网络剧片发行许可证 for that version,
    so any source holding one is unlicensed. The 三年/三年级 arm is deliberate filter evasion, which is why it must be isolated rather than merely ranked down. Measured 0.88% of rows / 0.77% of PV (250701),
    1.37% / 1.16% (260701).

    '
  policy: isolate_and_flag
- name: unlicensed_source_navigation
  patterns:
  - (樱花动漫|风车动漫|囧次元|泰剧兔|freeok|FreeOK|大师兄影视|小小影视|策驰|星辰影院|奇优影院|茶杯狐|cupfox|人人影视|麻花影视|西瓜影院|大地资源|大地影视|大地影院|荐片|悟空浏览器|7{3,5}影院)
  - (免费追剧|追剧app|追剧软件)
  - (免费.{0,2}入口|隐藏入口|官方入门网站)
  keywords: []
  rationale: 'Navigational queries whose destination is a named unlicensed AV site or app. 《互联网视听节目服务管理规定》(56号令) Art. 17 prohibits 转播/链接/聚合 非法视听节目网站 outright — the predicate is the destination''s licence,
    not the copyright status of any one title — and Art. 7 requires the 《信息网络传播视听节目许可证》 to provide AV service at all. Answering these well is the prohibited act, and 剑网2025/2026 name 搜索引擎、浏览器、网盘 as the
    enforcement target. 中消协 (2025-11) adds a consumer-safety limb: these apps bait with 「免费看热播剧」 and harvest location/contacts/camera. Measured 1.30% of rows / 1.58% of PV (250701), 1.15% / 1.07% (260701).

    '
  policy: isolate_and_flag
- name: offline_acquisition_channel
  patterns:
  - (网盘|百度云|百度网盘|阿里云盘|夸克|迅雷|磁力|提取码|种子下载)
  - (电影下载|电视剧下载|全集下载|资源)
  keywords: []
  rationale: 'Names a delivery mechanism no licensed Chinese OTT uses — 优酷/爱奇艺/腾讯/ 芒果/咪咕/红果 all deliver in-app. Unlike 免费观看, this vocabulary has no lawful instance to be confused with, which makes it the
    one query-text signal in this vertical that is a channel judgement rather than a guess about intent. Serving it means linking to 非法视听节目网站 (56号令 Art. 17) and forfeits the Art. 23 safe harbour of the
    信息网络传播权保护条例, since the 应知 test (法释〔2012〕20号 Art. 9, 12) is met by exactly the act of mining, ranking and surfacing such a template. Volatile between logs and therefore never to be sized from one: 0.19%
    of rows (250701) but 2.10% (260701), where 百度云/百度网盘 alone carry most of it.

    '
  policy: isolate_and_flag
- name: no_domestic_licence_supply
  patterns:
  - (双男主|耽美|腐剧|BL剧)
  - ((台|泰|韩)剧.{0,6}(双男主|腐))
  keywords: []
  rationale: 'A proxy for the axis clustering cannot see: works with no licensed mainland distribution. Where no licensed source exists, every relevance-optimal answer is by construction an unlicensed one,
    so the query is served correctly only by declining to rank sources at all and routing to availability information. THIS IS A PROXY AND MUST BE VALIDATED — the risk object is the answer, not the query,
    so a flagged pattern''s precision has to be checked against what its result set actually contains before any of it is treated as a finding. Measured 0.80% of rows / 1.51% of PV (250701), 0.39% / 0.50%
    (260701).

    '
  policy: isolate_and_flag
- name: restraint_and_tickle_fetish
  patterns:
  - (挠痒痒|挠脚心|挠脚底|挠.{0,4}脚)
  - (打屁股|捆绑|绑起来|踩踏|绞杀|舔脚)
  - (脚心|丝袜.{0,3}脚)
  rationale: 以束缚/挠痒/体罚为主题的癖好向视频需求，v1 的四条 obscene 正则与十个 keyword 对它命中为 0（与 v1 风险并集重叠 = 0 行）。它不使用任何标准色情词，因此 v1「标准词命中零行」的判断在这里以另一种方式成立：这一类根本不在色情词表的语义邻域里，而是靠一组中性动词。其中 7 行（6%）带明确未成年标记（小女生/小女孩/小朋友/初二/初中/儿童），例如「挠跳芭蕾小女孩脚心全集」「初二女孩脚板心被挠痒痒」——涉未成年的一支不能与其余同等处理。
  policy: isolate_and_flag
- name: foreign_unlicensed_access
  patterns:
  - (韩剧|泰剧|日剧|美剧|台剧|港剧).{0,12}(在线观看|免费观看|免费播放|免费看|全集|完整版|高清|资源|网盘|百度云|夸克|下载|在哪看|哪里看|在线播放|无删减|未删减|中字|字幕)
  - (在线观看|免费观看|免费播放|免费看|全集|完整版|高清|资源|网盘|百度云|夸克|下载|在哪看|哪里看|在线播放|无删减|未删减|中字|字幕).{0,12}(韩剧|泰剧|日剧|美剧|台剧|港剧)
  rationale: 这是 v1 `no_domestic_licence_supply` 想指的那个轴，但用可测的方式表达。v1 用「双男主|耽美|腐剧|BL剧」当代理，实测 141 行（0.321%）；本类 845 行（1.923%），两者只重叠 17 行。风险机理与 v1 写的一致：境外剧集在境内绝大多数没有引进批文与《网络剧片发行许可证》，所以「鬼怪韩剧在线观看完整版免费」的相关性最优答案按构造就是一个无证来源，回答得越好越违反
    56 号令第 17 条（禁止转播/链接/聚合非法视听节目网站）。这仍然是一个代理：授权状态是 TITLE 的属性，必须用 title × availability join 验证，正则只负责把需要验证的那一堆圈出来。附带发现：韩剧支线里有相当一股是韩国情色片（人间中毒/美景之屋/霜花店/下女/妻子N/女生宿舍N），与下面的 kr_hk_adult_title_family 重叠 44 行，风险是叠加的，不是二选一。
  policy: isolate_and_flag
- name: explicit_nudity_and_scale
  patterns:
  - (大尺度|尺度大|尺度很大|露点|全裸|赤裸|裸(体|戏|露|舞|播|身))
  rationale: 这一类存在的理由不是它的量（53 行 / 0.121%），而是它的分布：s25r 0.25%、s26r 0.15%，对上 s25t 0.05%、s26t 0.06% —— 随机侧是头部侧的 4 倍，53 行里 40 行来自两个随机搜索快照。v1 的四快照语料在搜索侧只有按 PV 的头部一万行，所以这个需求面在结构上不可见，不是 v1 判断失误。风险机理：这是不带片名、只带露骨程度修饰的检索（求「大尺度电影」而不是求某部电影），相关性最优的答案就是把过审边缘或未过审内容排上来；《网络视听节目内容审核通则》要求提供过审版本，而这类
    query 明确要求的是被审掉的那部分。它是 v1 「免费观看不是盗版信号」那条论证的反面：这里的词本身就是内容判断，不依赖片名的授权状态。
  policy: isolate_and_flag
- name: ncii_leak_aggregator
  patterns:
  - (吃瓜网|吃瓜视频|吃瓜观影|[0-9]{2}吃瓜|每日大赛|今日大瓜|黑料网|黑料不打烊|反差婊|暗黑爆料)
  rationale: v1 对这一类的覆盖是 0 行 —— 我实测本类与 v1 五个风险类的重叠为 0。这是「吃瓜/黑料」系聚合站：51吃瓜、每日大赛、今日大瓜、黑料网、吃瓜观影站、暗黑爆料。它们与前面几类的不同点在于风险对象不是作品而是人：主体内容是私密影像与他人隐私的非自愿传播（NCII），落的是《民法典》1032/1033 条隐私权、《个人信息保护法》以及刑法 364 条传播淫秽物品，而不只是
    56 号令的无证视听。对影视搜索面的意义是：这些站把自己包装成影视站（「吃瓜观影站」「51吃瓜抢先上映」），会被任何按站点形态做的聚合识别当成普通影视源收进来。量很小但性质是这批类别里最重的一个 —— 不可恢复的是被拍摄者，不是平台。
  policy: drop
- name: kr_hk_adult_title_family
  patterns:
  - (人间中毒|美景之屋|霜花店|下女|秘密爱|密爱(在线|电影|完整|免费|全|系列|[0-9])|娜塔莉|妻子[0-9]|女生宿舍[0-9]|善良的(小姨子|嫂子|阿姨)|年轻的母亲)
  - (蜜桃成熟|美丽的?小?(水)?蜜桃|小蜜桃|蜜桃[0-9]|蜜桃来偷欢|赤裸羔羊|赤裸特工|赤裸迷情)
  rationale: 与 v1 的 obscene_and_criminal_content 同一条依据（刑法 363/364，两高解释按点击数定罪；快播 2016 案排除「只提供技术」抗辩），只是 v1 的片名清单是日系里番 + 港产旧片十条，漏掉了本语料里量最大的两支：韩国情色片系列（人间中毒、美景之屋、霜花店、下女、密爱/秘密爱、娜塔莉、妻子N、女生宿舍N、善良的小姨子、年轻的母亲）和港产三级片系列（蜜桃成熟时、美丽小蜜桃、赤裸羔羊、赤裸特工、赤裸迷情）。这两支都没有公映许可证，境内任何可播放来源都是无证的；韩国这一支同时落在
