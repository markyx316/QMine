      - '(误服|误食|误吃|误喝|误吞|不小心(?:吃|喝|吞|咽)|(?:药|片|粒|胶囊)[^，,。]{0,8}(?:吃多了|吃过量|过量|多吃了)|过量服用|服药过量|吃药过量|一次(?:性)?(?:吃|喝|服)了[^，,。]{0,10}(?:片|粒|包|瓶|支)|(?:^|[^年月周天])吃了(?:[1-9][0-9]|十[一二三四五六七八九]?|[二两三四五六七八九]十)[^，,。]{0,2}(?:片|粒|颗)|鼠药|溴敌隆|敌敌畏|百草枯|(?:药物?|安眠药|农药|除草剂|杀虫剂|水银|汞|巴比妥|活络油)[^，,。]{0,3}中毒|喝了[^，,。]{0,6}(?:消毒液|84|洗洁精|洗衣液|农药)|吞(?:进|到|下)了?(?:肚|胃)|(?:^|[^年月周天])(?:吃|喝|服)了?(?:[1-9][0-9]+|十[一二三四五六七八九]?|[二三四五六七八九两]十[一二三四五六七八九]?)(?:片|粒|颗|瓶|支))'
  # v2 new: assistant instructions to reshape a body in an image. 28 rows (26 assistant head), 23 of them in med-pool5's residual. Never quote.
  - name: body_reshape_instruction
    policy: 'Do not generate or edit images that alter a person''s body; never quote.'
    patterns:
