pragmatic_intents_hint:
  - 'A drug-efficacy query (X的功效与作用) is an information lookup, not a request to take X.'
  - 'A normal-range query (X正常值) is self-assessment: the user is comparing their own number.'
  - 'A symptom query may be about the asker, someone they care for, or pure curiosity, and the wording rarely says which.'
  - 'TCM (中药材, 方剂, 穴位) and biomedicine (西药, 检查, 手术) are different answer surfaces even when the intent verb is identical.'
  - '''能不能'' and ''可以吗'' on a health topic are permission-seeking, which is where advice risk concentrates.'
  - 'A cost or institution query (多少钱, 哪家医院, 挂什么科) is navigational/transactional, not informational.'
  # v2: yes/no questions ends in 吗/嘛 (or 么 not after 什/怎/这/那/多/要): head search 4.09%, random search 24.39%,
  # assistant head 5.43%, assistant random 23.65%, voice head 3.19%, voice unknown 23.90%.
  - >
    A yes/no health question (...吗) asks for a VERDICT, and the random tail is full of them: 24.4% of
    random search rows against 4.1% of head search rows. The particle is identical whatever is being
    judged, so it decides nothing. What separates these rows is the OBJECT of the verdict, because each
    object needs a different answer.
    Permission to eat, drink or use something (西瓜豆腐能一起吃吗): 4.96% of random search vs 0.46% of head.
    Whether X works for a condition (硼酸洗液能治毛囊炎吗): 1.16% vs 0.45%.
    Whether X will cause an effect (睡前喝一杯无糖豆浆会胖吗): 1.13% vs 0.08%.
    Whether the asker's OWN number or finding is normal or serious (刚吃完饭血糖9.7正常吗, 肺结节4x5mm严重吗):
    0.97% vs 0.25%. Carrying one's own value is the boundary, not the word 正常 or 严重.
    How serious a disease is in general, with no value of the asker's: about 0.6-0.8% in both.
    The earlier medical taxonomy put the first three in one verdict class, own values in result
    interpretation, and general severity mostly in prognosis. That verdict class was 3% of labelled
    head rows but 19-26% of labelled random assistant and voice rows, so on a pool that is half random
    rows it will be far larger. If it needs dividing, divide it by object; never merge all of these
    into one "yes/no question" bucket.

domain_notes: >
  Chinese consumer health search pooled across eight snapshots: PV-ranked head and random 10k samples of
  search on 2025-07-01 and 2026-07-01, the AI assistant's medical category (head 1k, random 1k), a PV-ranked
  voice head (1,067 rows) and a voice export of unknown sampling (1k). Head and random are different strata
  (26 and 4 shared strings per year) and the tail churns (2 strings shared across years), so a class that is
  small in the head can be a head intent of the tail.

  Measured shape, head search / random search / assistant head / assistant random / voice head / voice unknown:
  question word 40.2 / 58.8 / 33.8 / 64.7 / 9.0 / 56.1%; ends in 吗 4.1 / 23.9 / 5.4 / 23.1 / 3.2 / 23.9%;
  six characters or fewer with no question word 16.0 / 6.4 / 39.9 / 5.4 / 74.7 / 13.0%; median length
  10 / 11 / 7 / 13 / 4 / 11 characters. The head is dominated by drug and herb efficacy lookups (X的功效与作用)
  and bare names; the random tail by yes/no and permission questions, own symptoms, and children and
  pregnancy (宝宝, 小孩, 个月 are many times denser than in the head); the voice head is bare spoken terms, and
  half of its strings also occur in head search.

  Traditional Chinese medicine and biomedicine coexist in the same log and often in the same phrasing, and
  they need different answer surfaces — treat that as an axis, not as noise.

  Risk here is carried by what a correct-looking answer would DO, not by taboo vocabulary: a dosage number,
  a diagnosis, or an unproven remedy presented as effective. A generic screen keyed to red-flag words fires on
  almost none of it. This profile is a screening floor for taxonomy work, not clinical or legal guidance.

  Boundary decisions the adjudication rules must make (measured on the earlier medical labels; not classes):
  (a) One phrasing family may split across named classes by a stated criterion, but never between a named
  class and the residual — the earlier taxonomy sent 52 of 77 BMI/standard-weight rows, 29 of 35 exercise
  how-tos and 29 of 91 reproductive-timeline rows to the residual. (b) A bare string is judged by what it
  names, not by its length: disease, drug, herb and test names are bare-entity lookups; a hospital name is
  navigation, under one rule. (c) A listed pharmaceutical company name (恒瑞医药, 华海药业) names an
  enterprise, not a drug: give it one home (71 of 89 such names occur in stock or quote queries of the
  finance corpus); brand-and-product names (云南白药, 片仔癀, 同仁堂) stay bare-entity lookups. (d) BMI or
  standard-weight calculation, normal ranges and food calories each need a named home; a calculator ask is
  never residual (36 of 36 went there before). (e) Reproductive calendar asks (排卵期, 预产期, 几天能测出怀孕)
  need one home, separate from recovery intervals. (f) Assistant follow-ups without a referent (有用吗,
  怎么服用) need one rule that ignores wording and punctuation (17 of 28 went to the residual, the rest to
  nine classes); identifying a photographed item is a separate ask.

  Legal anchors for risk on a Chinese health surface; they explain the risk screen, are not legal advice and
  do not define classes. (A) AI may not replace a physician in diagnosis or treatment or generate a
  prescription (《互联网诊疗监管细则（试行）》2022, Art. 13 and 21). (B) Medical, drug and device ads may not
  assert efficacy, promise cures, cite cure rates, compare providers or use endorsers (《广告法》Art. 16;
  《医疗广告管理办法》Art. 7). (C) Health knowledge may not be a disguised medical ad or carry a provider's
  contact or purchase link (《广告法》Art. 19; 《互联网广告管理办法》2023 Art. 8); a platform that knows of an
  illegal ad must stop it (《广告法》Art. 45). (D) Drugs on the medical-use narcotic and psychotropic lists
  (NMPA/MPS/NHC 公告2025年第55号) may not be sold online or advertised, and a prescription drug is sold online
  only against a verified real-name prescription (《药品管理法》Art. 61; 《药品网络销售监督管理办法》2022 Art. 8,
  9 and 13; 《广告法》Art. 15). (E) A registered health food may not claim to prevent or treat disease
  (《食品安全法》Art. 78; 《广告法》Art. 18) — not the ordinary food and herb efficacy lookups. (F) Content that
  sexualises minors must not be spread, and a platform must stop and report it (《未成年人保护法》Art. 50, 52
  and 80).
