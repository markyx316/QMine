  # v2: adds STI and medical-abortion drug names, and explicit sexual-act wording (line 4, 89 rows; the 性交 guard comes from a false positive measured on 金融8). 642 rows. Line 4 rows must never be quoted.
  - name: reproductive_and_sensitive
    policy: 'Age-appropriate and jurisdiction-aware routing.'
    patterns:
      - '(打胎|流产|避孕|人流|性病|艾滋|hiv|梅毒|阳痿|早泄)'
      - '(?i)(abortion|contracepti|std|hiv|erectile)'
      - '(药流|米非司酮|米索前列醇|堕胎|淋病|尖锐湿疣|生殖器疱疹)'
      - '(做爱|性交(?:[^了费钱通友叉往际换易]|$)|内射|无套|口交|肛交|自慰|手淫|打飞机|撸管|射精|破处|处破|爱爱|鸡巴|奶子|命根|硬不起|高潮|夫妻生活|房事)'
  # verbatim v1. 19 rows, 0 contain identifiable data. Named clinicians are NOT covered here (a report quote guard handles them).
  - name: personal_data_exposure
    policy: 'Never surface identifiable patient or record data.'
    patterns:
      - '(病历|检查报告|化验单|身份证号|就诊记录)'
      - '(?i)(medical record of|patient file|lab report of)'
