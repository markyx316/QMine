# Chinese consumer health / medical search, v2 — for the 8-snapshot corpus (`医疗8_pooled5.parquet`, 44,019 rows).
#
# WHY A SECOND FILE. `medical_zh.yaml` is the profile the DELIVERED med-pool5 run used; leaving it untouched keeps
# that run's resolved config reproducible. Fields not marked v2 are copied from it verbatim (and `template_seeds` is
# written once — v1 declares the key twice and PyYAML keeps the second).
#
# WHAT v2 CHANGES, AND ON WHAT EVIDENCE. Measured on 医疗8 (sources h25/r25/h26/r26/aT/aR/vH/vU) and, where labels are
# needed, on med-pool5's labels for the five shared sources (joined source by source, query equality asserted).
# Research: five independent lenses, every proposal re-measured by two skeptics, then one integration pass (2026-09-15).
#
# 1. THE RESIDUAL IS MOSTLY IN-DOMAIN. med-pool5 put 1,405 rows (6.12%) into OUT_OF_DOMAIN_OR_UNCLASSIFIABLE at
#    confidence 0.589 (domain 0.811), while the bottom-up route placed them in plainly medical leaves. They are health
#    lookups without a disease/drug object (BMI 52 of 77 rows to residual, exercise how-to 29 of 35, reproductive
#    timeline 29 of 91), listed pharma-company names (156), referent-less assistant follow-ups (112). The fix is
#    boundary guidance in domain_notes, not a new class.
# 2. "SHORT = BARE" IS A TRAP IN THE TAIL (the finance v2 lesson): judge a bare string by what it names.
# 3. RISK LIVES IN THE TAIL. v1's categories fire on the head's SEO phrasing; minors+sexual content, provider
#    ranking, self-medication, drug combinations, vulnerable-population dosing and ingestion are tail behaviours.
#    Flagged union v1 1,977 rows (4.49%) -> v2 2,870 (6.52%), by source 657/726/653/615/104/63/17/33 (FINAL set).
#    folk_remedy_and_cure_claims is NOT imported: its head hits were the speed word 最快.
# 4. SEEDS: v1's eight were mined on head search and covered 21.7/19.4% of the random strata. v2 repairs purity
#    (median td_l1 purity 0.752 -> 0.90) and adds four tail-relevant families; union 37.5% -> 41.6%, by source
#    54.4/29.6/59.6/28.4/39.8/21.3/19.8/30.2. Seeds skip the cohesion gate (bottomup.py:111) and every mined group
#    is dropped once seeds pass 0.40 coverage (templates.py); a seed under 0.004 x rows (176) vanishes silently.
# 5. WHERE TEXT GOES. pragmatic_intents_hint reaches only the architect, under "intents this taxonomy must carry",
#    so boundary reminders ("not a new class") live in domain_notes, which also reaches the researchers, the rule
#    writer and the redraw. A category's `rationale` and `policy` are read by nothing that decides.
# 6. NEVER-QUOTE IS NOT ENFORCED BY THE PIPELINE. screen_risk stores 8 samples + an exemplar per category, 6 go into
#    the risk_compliance prompt, and the fast workbook lists flagged rows. minors_and_sexual_content,
#    body_reshape_instruction and reproductive line 4 must be redacted/guarded in post-processing before delivery.
#
# PRE-RUN / POST-RUN CHECKS for med-pool8: after p1, template_groups.json lists all 12 seeds (dosage >= 177 hits);
# after p2a, risk_screen.json has 13 categories with the counts in the comments below; before delivery, redact
# samples of the never-quote categories and apply the report quote guard (named clinicians included).
#
# NOT medical advice and not a compliance artifact: a screening floor for a query taxonomy.
key: medical_zh_v2
display_name: "中文医疗健康搜索 Query（8 快照：搜索头部/随机 x 2 年 + 助手头部/随机 + 语音头部/未知抽样）"

language: zh
tokenizer: jieba
char_ngram_range: [1, 3]
word_ngram_range: [1, 2]

# Same Chinese encoders as v1; the bake-off still decides.
embedding_candidates:
  - BAAI/bge-small-zh-v1.5
  - BAAI/bge-base-zh-v1.5
  - BAAI/bge-large-zh-v1.5
  - shibing624/text2vec-base-chinese

# Phrasing families that judge the alpha sweep. Counts are hits on 医疗8; purity is the share of labelled hits in
# the modal med-pool5 td_l1 on the five shared sources.
template_seeds:
  # v2: dosage-form list extended (乳膏/凝胶/栓/贴剂/喷雾… and INN stems 他汀/沙坦/沙星…). 2,423 hits, td_l1 purity 0.994 on med-pool5 labels.
  - name: drug_efficacy
    pattern: '(((?<!图)片|丸|胶囊|颗粒|口服液|注射液|软膏|滴眼液|冲剂|糖浆|乳膏|注射|霉素|西林|拉唑|替丁|酸钠|凝胶|(?<![血溶])栓(?!塞)|贴剂|喷雾|溶液|混悬|单抗|洗液|滴剂|气雾|他汀|洛尔|地平|沙坦|普利|沙星)).{0,14}(功效|主治|用途|(?<!副)作用)'
    intent_hint: '求某个药品制剂（片/丸/胶囊/颗粒…）的功效与适应症'
  # v2: same negative lookahead over the extended form list, so the two efficacy seeds still partition (0 overlap). 5,067 hits, purity 0.812. expected_min_share removed: nothing reads it.
  - name: substance_efficacy
    pattern: '^(?!.*(((?<!图)片|丸|胶囊|颗粒|口服液|注射液|软膏|滴眼液|冲剂|糖浆|乳膏|注射|霉素|西林|拉唑|替丁|酸钠|凝胶|(?<![血溶])栓(?!塞)|贴剂|喷雾|溶液|混悬|单抗|洗液|滴剂|气雾|他汀|洛尔|地平|沙坦|普利|沙星))).*(功效|主治|用途|(?<!副)作用)'
    intent_hint: '求某味中药材/食材/保健成分的功效、作用与主治'
  # v2: rows reading an own result (偏高/阳性… + 什么原因/怎么回事) moved to result_interpretation by lookahead; weak tokens 引起的/的原因 dropped. 3,378 hits, purity 0.805.
  - name: symptom_cause
    pattern: '^(?!.*(偏高|偏低|升高|降低|增高|减低|阳性|阴性|超标|高|低)(是什么意思|是怎么回事|怎么回事|什么原因|说明什么|代表什么|意味着什么|的原因)).*(怎么回事|什么原因|是什么引起)'
    intent_hint: '求某个身体现象的成因'
  # v2 new, split off symptom_cause/term_definition by negative lookahead (as v1 split drug vs substance efficacy). 491 hits, purity 0.945.
  - name: result_interpretation
    pattern: '(偏高|偏低|升高|降低|增高|减低|阳性|阴性|超标|高|低)(是什么意思|是怎么回事|怎么回事|什么原因|说明什么|代表什么|意味着什么|的原因)'
    intent_hint: '解读自己某项检查结果偏高/偏低/阳性等的含义与原因'
  # v2: result rows excluded by lookahead; 是什么病 dropped; (?<!为)什么是 keeps 为什么是 out. 529 hits, purity 0.790 (v1 0.597).
  - name: term_definition
    pattern: '^(?!.*(偏高|偏低|升高|降低|增高|减低|阳性|阴性|超标|高|低)(是什么意思|是怎么回事|怎么回事|什么原因|说明什么|代表什么|意味着什么|的原因)).*(是什么意思|是什么东西|是指什么|(?<!为)什么是)'
    intent_hint: '求医学名词/缩写/指标的释义'
  # verbatim v1. 1,694 hits, purity 0.969.
  - name: symptom_list
    pattern: '(症状|前兆|征兆|临床表现)'
    intent_hint: '求某个疾病对应的症状清单'
  # verbatim v1. 250 hits, purity 0.990.
  - name: normal_range
    pattern: '(正常值|正常范围|正常是多少|多少正常|标准值|参考值|正常标准)'
    intent_hint: '求某项检验指标的正常区间与分级标准'
  # v2: 怎么办/用什么药/能治好 removed (the worst-purity tokens; 用什么药 depends on med-pool5's subject boundary) and cause asks excluded. 1,071 hits, purity 0.902; random-search coverage falls from ~4.2% to ~1.4%.
  - name: treatment_howto
    pattern: '^(?!.*(怎么回事|什么原因|是什么引起)).*(怎么治|如何治疗|吃什么药)'
    intent_hint: '求治疗或用药方案'
  # v2: 饭前/饭后/空腹/怎么吃 removed (purity 0.533 with them). 210 hits, purity 0.878 — above build_groups' silent min_share floor of 0.004 x 44,019 = 176.
  - name: dosage_and_administration
    pattern: '(一天吃几|一次吃几|用法用量|服用方法|吃几粒|吃几片|什么时候吃)'
    intent_hint: '求药品/补充剂的用法、用量与服用时机'
  # v2 new, a tail phrasing (48/572/53/609 per source head/random). 1,414 hits, purity 0.982 (n=228). Cohesion lift 1.234 is below the mined-group gate; it stays only because seeds skip that gate.
  - name: permission_verdict
    pattern: '^(?!.*(医院|保健院|诊所|门诊|科室|卫生院|体检中心|药店|发票)).*((可以|能)(吃|喝|用|抹|涂|擦|打|做|运动|洗澡|同房|喂奶|献血|游泳|熬夜)[^，,。？?]{0,6}吗|(能不能|可不可以|能否|可否)(吃|喝|用|抹|涂|擦|打|做|运动|洗澡|同房|喂奶|献血|游泳|熬夜)|(一起|同时)(吃|喝|用|服用)[^，,。？?]{0,4}吗)'
    intent_hint: '问某种食物、药物或行为在某种情况下能不能做（许可式是非问）'
  # v2 new. 1,591 hits, purity 0.921. Its random-strata matches include named clinicians and provider-ranking asks: exemplars must pass the report quote guards.
  - name: care_navigation
    pattern: '(医院|挂什么科|看什么科|挂哪个科|什么科室|挂号)'
    intent_hint: '就医导航：去哪家医院、挂什么科、怎么挂号'
  # v2 new. 275 hits, purity 0.872; 21 rows overlap care_navigation (only 3 labelled), no lookahead added.
  - name: care_cost
    pattern: '(多少钱|费用)'
    intent_hint: '询问诊疗项目、检查或药品的费用'

# Recall-oriented lexical screen: hits are FLAGGED for review (and never quoted in reports), never classified.
# Counts by source h25/r25/h26/r26/aT/aR/vH/vU on 医疗8.
risk_categories:
  # verbatim v1. 106 rows (8/24/17/42/1/12/0/2), tail-heavy; precision 31/40 (not re-audited on the tail).
  - name: self_medication_and_dosage
    policy: 'Never state a dose. Route to a pharmacist or the package insert.'
    patterns:
      - '(吃多少|服用多少|一次几片|一天几次|剂量|加量|减量|停药|自己吃|自行服用)'
      - '(?i)(what dose|how many pills|how much .* should i take)'
  # verbatim v1. 997 rows, head-heavy (什么原因引起 SEO phrasing); 31/40 read correct.
  - name: self_diagnosis
    policy: 'Never diagnose. Describe what the symptom can indicate and route to care.'
    patterns:
      - '(我这是不是|是什么病|什么原因引起|症状对照|自测|测一测|严重吗|要紧吗)'
      - '(?i)(do i have|is it serious|what disease|self.?diagnos)'
  # v2: absorbs health_zh's cure-claim words (根治/根除/断根/除根/包好/保证治愈/不复发/神药…) and does NOT import folk_remedy_and_cure_claims, whose head-heavy 476 hits came from the speed word 最快 (a head SEO suffix, h25 207 / r25 22), not a cure claim. 206 rows (84/21/76/15/7/2/0/1).
  - name: unproven_or_dangerous_remedy
    policy: 'Do not present as effective. Say what the evidence is.'
    patterns:
      - '(偏方|秘方|祖传|土方法|土方子|土办法|民间方|根治(?:[^术性]|$)|根除(?:[^术]|$)|断根|除根|去根|特效药|特效针|(?:^|[^精安提])神药|包治|包好|保证治愈|不用去医院|自己在家治|排毒|以毒攻毒|不复发)'
      - '(?i)(miracle cure|cure .* permanently|home remedy for)'
  # v2: v1 had zero head hits and near-zero recall; word order and population forms widened (孕妇/哺乳期/宝宝/几个月/老人…). 148 rows.
  - name: vulnerable_population_dosing
    policy: 'Highest-caution routing: pregnancy, infants, elderly, chronic conditions.'
    patterns:
      - '(?:孕妇|孕期|怀孕|备孕|哺乳期|喂奶|婴儿|宝宝|小孩|儿童|幼儿|新生儿|小朋友|(?:^|[^男女])孩子|小儿|(?:^|[^0-9])(?:1[0-7]|[1-9])周?岁|(?:^|[^0-9一二三四五六七八九十两])(?:十[一二三四五六七]?|[一二三四五六七八九两])周?岁半?|[0-9一二三四五六七八九十两半]+个多?月(?:大)?(?:的)?(?:宝宝|婴儿|宝|孩子|小孩))[^，,。]{0,12}(?:能不能|可不可以|可以|能)(?:吃|喝|用|服用|打|涂|抹)'
      - '(?:能不能|可不可以|可以|能)(?:吃|喝|用|服用|打|涂|抹)[^，,。]{0,12}(?:孕妇|孕期|哺乳期|宝宝|小孩|儿童|婴儿|新生儿)'
      - '(?:孕妇|孕期|怀孕|备孕|哺乳期|喂奶|婴儿|宝宝|小孩|儿童|幼儿|新生儿|小朋友|(?:^|[^男女])孩子|小儿|(?:^|[^0-9])(?:1[0-7]|[1-9])周?岁|(?:^|[^0-9一二三四五六七八九十两])(?:十[一二三四五六七]?|[一二三四五六七八九两])周?岁半?|[0-9一二三四五六七八九十两半]+个多?月(?:大)?(?:的)?(?:宝宝|婴儿|宝|孩子|小孩))[^，,。]{0,8}(?:吃多少|用量|剂量|吃几|喝多少|怎么吃|怎么服用|用法)'
      - '(?:孕妇|孕期|怀孕|备孕|哺乳期|喂奶|婴儿|宝宝|小孩|儿童|幼儿|新生儿|小朋友|(?:^|[^男女])孩子|小儿|(?:^|[^0-9])(?:1[0-7]|[1-9])周?岁|(?:^|[^0-9一二三四五六七八九十两])(?:十[一二三四五六七]?|[一二三四五六七八九两])周?岁半?|[0-9一二三四五六七八九十两半]+个多?月(?:大)?(?:的)?(?:宝宝|婴儿|宝|孩子|小孩))[^，,。]{0,12}(?:吃什么药|用什么药|吃啥药|用啥药|用什么药膏)'
      - '(?:药|片|颗粒|胶囊|布洛芬|头孢|激素|打针|输液)[^，,。]{0,10}(?:喂奶|喂母乳|影响母乳|哺乳|母乳喂养)'
      - '(?:老人|老年人)[^，,。]{0,12}(?:吃什么药|用什么药|吃啥药|用啥药)'
      - '(?:孕妇|孕期|怀孕|备孕|哺乳期|喂奶|婴儿|宝宝|小孩|儿童|幼儿|新生儿|小朋友|(?:^|[^0-9])(?:1[0-7]|[1-9])周?岁|(?:^|[^0-9一二三四五六七八九十两])(?:十[一二三四五六七]?|[一二三四五六七八九两])周?岁半?|[0-9一二三四五六七八九十两半]+个多?月(?:大)?(?:的)?(?:宝宝|婴儿|宝|孩子|小孩))[^，,。]{0,12}(?:吃|喝|服用|用)[^，,。]{0,10}(?:多少毫升|几毫升|多少毫克|几粒|几片|几袋|几包)'
      - '(孕妇能|哺乳期能|怀孕能|小孩能|儿童能|婴儿能|老人能|宝宝能)(不能)?(吃|喝|用)'
      - '(?i)(safe (during|in) pregnancy|for (infants|toddlers|children))'
  # v2: requires a drug on one side; bare 禁忌/忌口/相克 facets dropped (150 v1-flagged rows lose the flag, mostly herb/food efficacy); drug+alcohol and herbal 配伍禁忌 added. 295 rows (21/120/18/111/1/13/0/11).
  - name: drug_interaction
    policy: 'Never assert safety of a combination.'
    patterns:
      - '(?:[^山芍么酒农]药|^药|[^图薯]片|^片|[^鱼肉虾]丸|^丸|胶囊|颗粒|口服液|注射液|合剂|混悬液|针剂|疫苗|乳膏|软膏|凝胶|霉素|沙星|西林|韦林|头孢|布洛芬|阿司匹林|阿斯匹林|他汀|维生素|钙片|冲剂|唑|环素|洛韦|沙坦|地平|普利|双胍|胰岛素|西替利嗪|雷他定|甲钴胺|谷维素|感冒灵|蒲地蓝|板蓝根|藿香正气|美林|西地那非)[^，,。？?]{0,24}(?:(?:一起|同时|一块|一同)(?:能|可以)?(?:吃|服|用|喝|使用|服用|打|接种)|(?:[^不共相]|^)同(?:服|吃|用)|混用|混着(?:吃|用)|[^愈适结]合用|^合用|有冲突|冲突吗|相克|配伍|搭配(?:吃|服|用))'
