# Sports query log (Part IV §4.4). Simplest intent axis of the five; hardest
# recency profile.
key: sports_zh
display_name: "体育搜索 Query"
language: zh

tokenizer: jieba
char_ngram_range: [1, 3]
word_ngram_range: [1, 2]

embedding_candidates:
  - BAAI/bge-base-zh-v1.5
  - BAAI/bge-small-zh-v1.5

template_seeds:
  - name: score_result
    pattern: "(比分|比赛结果|赢了吗|多少比多少|战报)"
    intent_hint: "求比赛结果"
  - name: schedule_live
    pattern: "(赛程|直播|几点开始|在哪看|回放)"
    intent_hint: "求观赛入口/时间"
  - name: transfer_injury
    pattern: "(转会|伤病|复出|续约|离队)"
    intent_hint: "求球员动态"
  - name: head_to_head
    pattern: "(和.{1,10}谁厉害|谁更强|历史交锋|对战记录)"
    intent_hint: "两方实力比较"
  - name: honours
    pattern: "(夺冠几次|拿过几个|总冠军|纪录是多少|身高体重)"
    intent_hint: "求球员/球队档案数字"

risk_categories:
  - name: betting
    patterns: ["盘口", "让球", "亚盘", "大小球", "推荐比分", "串关", "水位"]
    keywords: ["竞彩推荐", "稳胆"]
    rationale: "Betting-market probes — structurally identical to the K12 zodiac case."
    policy: isolate_and_flag

expected_l1_range: [10, 15]
expected_family_range: [8, 16]

pragmatic_intents_hint:
  - "观赛入口导航"
  - "球迷情绪/立场表达"
  - "赛事规则求解"

domain_notes: >
  Entity-dominated (teams, players) and strongly seasonal. Expect a lower
  stability peak than K12 because the intent axis is genuinely narrower. Rerun
  the maintenance loop monthly rather than quarterly during a season.
