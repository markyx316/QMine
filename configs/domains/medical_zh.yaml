# Chinese consumer health / medical search.
#
# Written after a pre-flight on a real 10,000-row 医疗 log: the `generic` risk
# screen flagged **1 row (0.01%)**. That is not generic failing — its own note
# says the list is "a floor to be extended per vertical and per jurisdiction" —
# but a medical taxonomy whose risk axis fires on 0.01% of a medical corpus is
# reporting nothing. Health queries carry risk through what the ANSWER would be,
# not through taboo vocabulary: "血压正常值是多少范围" is a self-assessment and
# "甲钴胺片的功效和作用" is drug information, and neither contains a red-flag word.
#
# NOT medical advice and not a compliance artifact. This is a screening floor for
# a query taxonomy; a deployed health surface needs clinical and legal review.
key: medical_zh
display_name: "Chinese consumer health / medical query log"

language: zh
tokenizer: jieba
char_ngram_range: [1, 3]
word_ngram_range: [1, 2]

# Same Chinese encoders the K12 bake-off ranked; the bake-off still decides.
embedding_candidates:
  - BAAI/bge-small-zh-v1.5
  - BAAI/bge-base-zh-v1.5
  - BAAI/bge-large-zh-v1.5
  - shibing624/text2vec-base-chinese

# ZERO template seeds, deliberately, as `generic` argues: a phrasing family is
# exactly what differs between verticals, Phase 1 mines them from the corpus,
# and Phase 3 makes each earn its place against random rows. Seeding them here
# would import this one log's phrasing into every future medical corpus.
template_seeds: []

# Extends generic's universal floor with the hazards specific to health search.
# Patterns stay deliberately lexical and recall-oriented: this screen FLAGS for
# review, it does not classify, and a false positive costs a look while a false
# negative ships.
template_seeds:
  # MINED AND MEASURED on both 医疗 snapshots (10,000 rows each), not invented.
  # Coverage 54.5% / 60.1% of rows and 61.2% / 69.2% of PV, worst cross-seed
  # overlap 11-12%. The profile shipped with ZERO seeds, which is how `med-pool`
  # came to report "NO template group passed the cohesion check (0/12)": with no
  # seeded anchor every group is mined, and pooling two snapshots loosens them
  # enough to fail cohesion. The alpha decision then rests on masks not known to
  # be same-intent.
  #
  # `有哪些` was tested and REJECTED as a seed. It is a phrasing, not an intent —
  # it enumerates symptoms, foods, types and hospitals alike, so it sweeps four
  # intents into one family and breaks the contract that makes these the judge of
  # the alpha sweep. Where it qualifies an intent (症状有哪些) that intent's own
  # seed already catches it.
  #
  # `禁忌/副作用` was tested and REJECTED for the same reason: 67% of its matches
  # also matched efficacy, because 芒果的功效与作用禁忌 is an efficacy query with a
  # contraindication FACET. Facets are not phrasing families. The
  # `drug_interaction` risk category below still covers the compliance angle.
  # THE EFFICACY ASK, SPLIT BY SUBJECT — because one family at 27-33% of the
  # corpus is a weak anchor for the alpha sweep, and because the subject is what
  # the taxonomy actually splits on: `med04` delivered TCM_FOOD_EFFICACY (24.6%)
  # and DRUG_EFFICACY (10.2%) as two separate L1 classes from this one phrasing.
  # The dosage form is the only lexical signal that separates them.
  #
  # `(?<!图)片` NOT `片`: bare 片 matches inside 图片 (picture), so
  # 黄皮果的功效与作用图片 — a fruit — was being read as a pharmaceutical tablet.
  # 6 such rows on 250701.
  - name: drug_efficacy
    pattern: "((?<!图)片|丸|胶囊|颗粒|口服液|注射液|软膏|滴眼液|冲剂|糖浆).{0,14}(功效|主治|用途|(?<!副)作用)"
    intent_hint: "求某个药品制剂（片/丸/胶囊/颗粒…）的功效与适应症"
  - name: substance_efficacy
    # NEGATIVE LOOKAHEAD, so the two efficacy seeds PARTITION rather than nest.
    # Without it `substance` is a superset of `drug` and both match every
    # efficacy query — measured, 2,749/2,752 overlap, which is not two families.
    # Disjoint: 835 + 1,917 = 2,752, exactly the single seed's reach, 0 overlap.
    pattern: "^(?!.*((?<!图)片|丸|胶囊|颗粒|口服液|注射液|软膏|滴眼液|冲剂|糖浆)).*(功效|主治|用途|(?<!副)作用)"
    intent_hint: "求某味中药材/食材/保健成分的功效、作用与主治"
    expected_min_share: 0.19
  - name: symptom_cause
    pattern: "(怎么回事|什么原因|引起的|是什么引起|的原因)"
    intent_hint: "求某个身体现象的成因"
  - name: symptom_list
    pattern: "(症状|前兆|征兆|临床表现)"
    intent_hint: "求某个疾病对应的症状清单"
  - name: treatment_howto
    pattern: "(怎么治|如何治疗|吃什么药|用什么药|怎么办|能治好)"
    intent_hint: "求治疗或用药方案"
  - name: term_definition
    pattern: "(是什么意思|是什么东西|是什么病|是指什么|什么是)"
    intent_hint: "求医学名词/缩写/指标的释义"
  - name: normal_range
    pattern: "(正常值|正常范围|正常是多少|多少正常|标准值|参考值|正常标准)"
    intent_hint: "求某项检验指标的正常区间与分级标准"
  - name: dosage_and_administration
    pattern: "(一天吃几|一次吃几|用法用量|服用方法|怎么吃|饭前|饭后|空腹)"
    intent_hint: "求药品/补充剂的用法、用量与服用时机"

risk_categories:
  - name: self_medication_and_dosage
    policy: "Never state a dose. Route to a pharmacist or the package insert."
    patterns:
      - '(吃多少|服用多少|一次几片|一天几次|剂量|加量|减量|停药|自己吃|自行服用)'
      - '(?i)(what dose|how many pills|how much .* should i take)'
  - name: self_diagnosis
    policy: "Never diagnose. Describe what the symptom can indicate and route to care."
    patterns:
      - '(我这是不是|是什么病|什么原因引起|症状对照|自测|测一测|严重吗|要紧吗)'
      - '(?i)(do i have|is it serious|what disease|self.?diagnos)'
  - name: unproven_or_dangerous_remedy
    policy: "Do not present as effective. Say what the evidence is."
    patterns:
      - '(偏方|秘方|祖传|根治|特效药|包治|不用去医院|自己在家治|排毒|以毒攻毒)'
      - '(?i)(miracle cure|cure .* permanently|home remedy for)'
  - name: vulnerable_population_dosing
    policy: "Highest-caution routing: pregnancy, infants, elderly, chronic conditions."
    patterns:
      - '(孕妇能|哺乳期能|怀孕能|小孩能|儿童能|婴儿能|老人能|宝宝能)(不能)?(吃|喝|用)'
      - '(?i)(safe (during|in) pregnancy|for (infants|toddlers|children))'
  - name: drug_interaction
    policy: "Never assert safety of a combination."
    patterns:
      - '(能一起吃吗|同服|一起服用|冲突吗|相克|忌口|禁忌)'
      - '(?i)(take .* together|interaction between|contraindicat)'
  - name: prescription_and_controlled
    policy: "Do not explain how to obtain without a prescription."
    patterns:
      # BARE `激素` MATCHES A LAB TEST, NOT A CONTROLLED DRUG. Measured on both
      # snapshots it caught 促甲状腺激素高 (TSH), 性激素六项, 人绒毛膜促性腺激素
      # (hCG), 抗缪勒氏管激素 (AMH) and 雌激素低的症状 — endocrine measurements and
      # symptoms, 23 of 40 hits on 250701. A false positive here ISOLATES an
      # ordinary lab-result question into a controlled-substance bucket. The
      # drug sense needs the drug word.
      - '(处方药|不用处方|怎么开到|哪里能买到.*药|抗生素|安眠药|止痛药|激素(?:药|类药|针|软膏|治疗)|打激素|用激素)'
      - '(?i)(without a prescription|where to buy .* (pills|medication))'
  - name: self_harm_and_crisis
    policy: "Crisis routing takes precedence over every other intent."
    patterns:
      - '(自杀|不想活了|怎么死|自残|安乐死|一次吃多少片能)'
      - '(?i)(kill myself|suicide method|want to die|self harm|overdose on)'
  - name: reproductive_and_sensitive
    policy: "Age-appropriate and jurisdiction-aware routing."
    patterns:
      - '(打胎|流产|避孕|人流|性病|艾滋|hiv|梅毒|阳痿|早泄)'
      - '(?i)(abortion|contracepti|std|hiv|erectile)'
  - name: personal_data_exposure
    policy: "Never surface identifiable patient or record data."
    patterns:
      - '(病历|检查报告|化验单|身份证号|就诊记录)'
      - '(?i)(medical record of|patient file|lab report of)'

# Wider than K12: a health log spans drug information, symptom lookup, procedure
# and cost questions, institution lookup, and TCM alongside biomedicine. Left
# generous on purpose — the K locator decides, this only bounds the search.
expected_l1_range: [12, 30]
expected_family_range: [8, 28]

pragmatic_intents_hint:
  - "A drug-efficacy query (X的功效与作用) is an information lookup, not a request to take X."
  - "A normal-range query (X正常值) is self-assessment: the user is comparing their own number."
  - "A symptom query may be about the asker, someone they care for, or pure curiosity, and the wording rarely says which."
  - "TCM (中药材, 方剂, 穴位) and biomedicine (西药, 检查, 手术) are different answer surfaces even when the intent verb is identical."
  - "'能不能' and '可以吗' on a health topic are permission-seeking, which is where advice risk concentrates."
  - "A cost or institution query (多少钱, 哪家医院, 挂什么科) is navigational/transactional, not informational."

domain_notes: >
  Chinese consumer health search. Queries are short (median ~10 characters) and
  dominated by drug and herb efficacy lookups (X的功效与作用), normal-value
  self-assessment (X正常值是多少), symptom explanation, and department/institution
  routing (挂什么科, 哪家医院). Traditional Chinese medicine and biomedicine
  coexist in the same log and often in the same phrasing, and they need different
  answer surfaces — treat that as an axis, not as noise.

  Risk here is carried by what a correct-looking answer would DO, not by taboo
  vocabulary: a dosage number, a diagnosis, or an unproven remedy presented as
  effective. A generic screen keyed to red-flag words fires on almost none of it.
  This profile is a screening floor for taxonomy work, not clinical or legal
  guidance.
