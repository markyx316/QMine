# POOLED-8 corpus for the 金融 vertical: the five sources of `pool5_fin.yaml` PLUS the three
# exports that arrived 2026-09-14 — search random-10k for both years, and a PV-ranked voice head.
#
# Built by `analysis/pooled5/build_fin8_corpus.py`, which asserts cell-for-cell that the five
# shared snapshots come out identical to the delivered `金融_pooled5.parquet`. So this corpus is
# a strict superset of the one fin-pool5 mined, and any difference in results is attributable to
# the three new exports rather than to a rebuild.
#
# WHAT THE NEW EXPORTS BUY. Until now search was head-only, so "search vs assistant" and
# "head vs tail" were confounded — every interface finding could have been a depth finding.
# With a random stratum on both search years the design becomes interface x stratum, and the
# two can finally be separated. Measured on the raw files: head ∩ random = 30 strings of 10,000,
# PV median 285 vs 1, and the tail churns year over year (rand25 ∩ rand26 = 30) while the head
# persists (head25 ∩ head26 = 5,447).
#
# `extends: live.yaml` because `--config` REPLACES the default rather than merging it; without
# this line the whole provider policy is silently dropped.
extends: live.yaml

data:
  input_path: data/raw/pooled5/金融8_pooled5.parquet
  text_column: query

  # Normalised WITHIN source to 10,000 (see the builder). Search PV, assistant PV, a PV-ranked
  # voice head and a voice export with no PV at all are four different instruments; raw PV
  # pooled over them would make every weighted metric a statement about search.
  weight_column: pv_norm

  # `ops/drift.label_drift` compares EXACTLY two groups, so p10b is pointed at the two-level
  # surface column. The eight-level `source` column rides along for the post-run analysis and is
  # re-joined positionally (`labels_full.csv` preserves input order). Eight sources still map to
  # exactly two surfaces (搜索 / AI助手), so this stays a two-group comparison.
  snapshot_column: surface

  # The two groups differ by SURFACE, not by date: the time branch's prose would be false here
  # and one of its caveats inverts (.claude/rules/multi-snapshot.md). Note that a genuine time
  # axis now also exists INSIDE the search side (2025 vs 2026, at both strata) — that comparison
  # is made in the post-run analysis, not by p10b.
  comparison_axis: stratum

  # Deliberately empty. `l2` exists for assistant rows only (~4% coverage here, lower than in
  # pool5 because the corpus doubled) — declared as a reference it would ask the K locator to
  # find a partition that separates the assistant from search, which is the comparison, not the
  # frame.
  reference_label_columns: []
