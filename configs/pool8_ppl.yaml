# POOLED-8 corpus for the 人物 vertical: the four sources of `pool5_ppl_b.yaml` PLUS the four
# exports that arrived 2026-09-16 — search random-10k for both years, a PV-ranked voice head and a
# random voice 1k.
#
# Built by `analysis/pooled5/build_pool8_corpus.py`, which asserts cell-for-cell that the four
# shared snapshots come out identical to the delivered `人物_pooled5.parquet`. So this corpus is a
# strict superset of the one ppl-pool5b mined, and any difference in results is attributable to the
# four new exports rather than to a rebuild.
#
# WHAT THE NEW EXPORTS BUY. Until now search was head-only and there was no voice at all, so
# "search vs assistant" and "head vs tail" were confounded and input mode could not be looked at.
# With a random stratum on both search years the design becomes interface x stratum, and the two
# voice exports add input mode with a head and a random stratum of its own. Measured on the raw
# files: head ∩ random = 14 strings of 10,000 (2025) and 10 (2026); the random strata churn
# completely year over year (rand25 ∩ rand26 = 0) while the voice head overlaps the search heads
# heavily (643 / 692) — the same string gets typed and spoken.
#
# ROUTING: EVERY ZHIPU-ASSIGNED ROLE GOES ELSEWHERE, exactly as in `pool5_ppl_b.yaml`. On this
# material — Chinese public figures, including political ones — Zhipu returns 400 `contentFilter`
# on generation: measured on ppl-pool5, `researcher_pragmatic_intents` (glm-5.3-flash) refused 3/3
# in both generations and `risk_sentinel` (glm-5.3) refused 3/3 in gen01, which halted p7_audit.
# The refusals are a property of the material, not of the run, so the remedy is routing, not
# retrying. DeepSeek and Moonshot handled the same corpus without a single refusal.
#
# `extends: live.yaml` because `--config` REPLACES the default rather than merging it; without this
# line the whole provider policy is silently dropped.
extends: live.yaml

data:
  input_path: data/raw/pooled5/人物8_pooled5.parquet
  text_column: query

  # Normalised WITHIN source to 10,000 (see the builder). Search PV, assistant PV and two voice PV
  # columns are different instruments; raw PV pooled over them would make every weighted metric a
  # statement about search. NOTE for the report: the assistant head export loses 33.4% of its raw PV
  # to cleaning, so this domain reports row shares first and traffic only as a supplement.
  weight_column: pv_norm

  # `ops/drift.label_drift` compares EXACTLY two groups, so p10b is pointed at the two-level surface
  # column. The eight-level `source` column rides along for the post-run analysis and is re-joined
  # positionally (`labels_full.csv` preserves input order).
  snapshot_column: surface

  # The two groups differ by SURFACE, not by date: the time branch's prose would be false here and
  # one of its caveats inverts (.claude/rules/multi-snapshot.md). A genuine time axis now also exists
  # INSIDE the search side (2025 vs 2026, at both strata) — that comparison is made in the post-run
  # analysis, not by p10b.
  comparison_axis: stratum

  # Deliberately empty. `l2` exists for assistant rows only (~4% coverage) — declared as a reference
  # it would ask the K locator to find a partition that separates the assistant from search, which is
  # the comparison, not the frame.
  reference_label_columns: []

llm:
  model_overrides:
    risk_sentinel: openrouter:moonshotai/kimi-k3
    researcher: openrouter:moonshotai/kimi-k3
    domain_scout: deepseek:deepseek-v4-pro
    maintainer: openrouter:moonshotai/kimi-k3
    reporter: deepseek:deepseek-v4-pro
    referee: openrouter:moonshotai/kimi-k3
