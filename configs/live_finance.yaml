# Finance slice of the house export (金融query-*.xlsx).
#
# Everything about COLUMNS comes from `corpus_wise_export.yaml`, and everything
# about PROVIDERS from `live.yaml` beneath it. This file therefore states only
# what is true of the finance corpus specifically — which today is nothing beyond
# the domain profile, passed with `--domain finance_zh`.
#
# Keep it: a per-corpus file is where a corpus-specific override goes when one
# turns up (a different sample size, a pinned gold size, a tighter alpha grid),
# and having the file already in the chain means adding one is a one-line edit
# rather than a restructure.
extends: corpus_wise_export.yaml
